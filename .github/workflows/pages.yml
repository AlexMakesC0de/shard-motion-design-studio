name: Pages

# Publishes site/ to GitHub Pages, with the brand marks and the Look previews
# copied in at build time so the images live in one place in the repo.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/public/brand/**"
      - "docs/images/looks/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/assets/brand _site/assets/looks
          cp site/index.html _site/
          cp web/public/brand/shard-icon.svg web/public/brand/shard-mark.svg _site/assets/brand/
          cp docs/images/looks/*.jpg _site/assets/looks/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
