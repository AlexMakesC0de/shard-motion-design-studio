name: CI

# Runs every test suite on each push and pull request. Nothing here needs an
# API key or spends money: provider calls in the tests are stubs.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json
      # The runner's Azure mirror can stall mid-download, so apt gives up on a
      # stalled fetch and the last try uses the main Ubuntu mirror. The
      # finishing tests still skip themselves if ffmpeg never arrives.
      - name: Install ffmpeg (for the finishing tests)
        timeout-minutes: 6
        continue-on-error: true
        run: |
          command -v ffmpeg && exit 0
          apt="sudo apt-get -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3"
          for try in 1 2 3; do
            if [ "$try" = 3 ]; then
              sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            fi
            $apt update && $apt install -y --no-install-recommends ffmpeg && exit 0
            echo "ffmpeg install try $try failed"
          done
          exit 1
      - name: Install studio and MCP dependencies
        run: |
          npm --prefix web ci
          npm --prefix mcp ci
      - name: CLI tests
        run: npm test
      - name: Studio tests
        run: npm run test:web
      - name: MCP server tests
        run: npm run test:mcp

  templates:
    name: Ad templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check source hashes, templates and gallery
        run: npm run validate
      - name: Check generated files are current
        run: git diff --exit-code -- skills/motion-design/assets/gallery.html skills/motion-design/references/preset-index.md
